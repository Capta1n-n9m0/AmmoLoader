[mod-setting-description]
ammo_loader_enabled=Uncheck to disable the mod temporarily during a game.
ammo_loader_draw_range=When enabled, draw range perimeter when hovering over chest. Disable if the game lags when selecting Loader Chests.
ammo_loader_debugging=Print debugging info to console.
ammo_loader_chest_radius=Maximum distance the chests will work from.\n\n[font=default-bold]0 = infinite[/font]
ammo_loader_item_fill_size=Amount of items to insert at once when filling inventories.
ammo_loader_provided_slots_per_tick=Number of script-reliant inventories to check per tick (cars, trains, characters, cross-surface entities).
ammo_loader_check_after_research=[font=default-bold]*WILL CAUSE LAG AFTER COMPLETING RESEARCH*[/font]\n\nPerform a full table check after completing research. Used for mod compatibility.
ammo_loader_ignore_logistic_turrets=Ignore turrets that have logistic interfaces from Logistic Turrets mod.
ammo_loader_bypass_research=Enable this to make Loader Chests available without research.
ammo_loader_feature_artillery=Enable artillery turrets and wagons. Adds the Artillery research. Requires a new game or map reset.
ammo_loader_feature_vehicle_ammo=Enable ammo loading for cars and spidertrons. Adds the Vehicle Ammo research. Requires a new game or map reset.
ammo_loader_feature_vehicle_fuel=Enable fuel loading for cars and spidertrons. Adds the Vehicle Fuel research. Requires a new game or map reset.
ammo_loader_feature_train_fuel=Enable fuel loading for locomotives. Adds the Train Fuel research. Requires a new game or map reset.
ammo_loader_feature_burner_structures=Enable fuel loading for stationary burner structures. Adds the Burner Structures research. Requires a new game or map reset.
ammo_loader_feature_logistics=Enable requester and passive provider Loader Chest variants connected to the logistic network. Adds the Logistic Integration research. Requires a new game or map reset.
ammo_loader_feature_return_items=Enable returning surplus ammo/fuel to Storage Loader Chests. Adds the Return Items research. Requires a new game or map reset.
ammo_loader_feature_upgrade_ammo=Enable automatic ammo upgrading. Adds the Upgrade research. Requires a new game or map reset.
ammo_loader_provide_all_surfaces=Allow Loader Chests to provide to entities on other surfaces. Disable for same-surface only.\n\n[font=default-bold]May cause issues with Space Age when enabled.[/font] Requires a new game or map reset.
ammo_loader_repair_tool_stack_size=Stack size of repair tool items. 0 = unchanged.
ammo_loader_highlight_selected_consumer=Highlight entities that are actively using Loader Chests when hovering over them.

