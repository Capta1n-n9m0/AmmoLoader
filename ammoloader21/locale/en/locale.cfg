[technology-description]
ammo-loader-tech-loader-chest=Through innovative weapon design and careful logistical coordination, you have discovered ways to make ammunitions distribution much easier.
ammo-loader-tech-requester-chest=Loader Chest variants that connect to the logistic network as requester and passive provider chests.
ammo-loader-tech-vehicles=Loader Chests can now automatically resupply cars and spidertrons with ammo.
ammo-loader-tech-vehicle-fuel=Loader Chests can now automatically resupply cars and spidertrons with fuel.
ammo-loader-tech-train-fuel=Loader Chests can now automatically resupply locomotives with fuel.
ammo-loader-tech-burners=Loader Chests can now automatically resupply stationary burner structures with fuel.
ammo-loader-tech-artillery=With the aid of advanced logistics research, you have discovered how the Loader Chests can be used to supply Artillery turrets and wagons.
ammo-loader-tech-upgrade=Prioritization and organization of existing supply depots now makes it possible to automatically upgrade Ammunition in existing outposts.
ammo-loader-tech-return-items=Unlocking the munition supply lines to run in both directions has allowed easy restocking of supplies in obsolete outposts.

[technology-effect-description]
amlo-effect-vehicles=Loader Chests can now fill vehicles with ammo.
amlo-effect-vehicle-fuel=Loader Chests can now fill cars and spidertrons with fuel.
amlo-effect-train-fuel=Loader Chests can now fill locomotives with fuel.
amlo-effect-burners=Loader Chests can now fill burner structures with fuel.
amlo-effect-artillery=Loader Chests can now fill artillery installations with shells.
amlo-effect-upgrade=Loader Chests can now upgrade ammo and fuel to the best available option.
amlo-effect-return-items=Items are returned to Storage Loader Chests when picked up or when better ammo is available.


